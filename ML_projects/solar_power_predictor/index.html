<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Solar Power Predictor</h1>

      <div class="input-container">
        <input type="text" id="capacity-input" placeholder="Plant Cap (kw)" />
        <button id="get-weather-btn">Predict</button>
        <span id="output">avg output</span>
      </div>

      <div id="weather-info" class="hidden">
        <h1 id="head"></h1>
        <p id="temperature"></p>
        <p id="description"></p>
      </div>
      <p id="error-message" class="hidden"></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
